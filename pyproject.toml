[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker_split"
version = "0.1.0"
description = "화자 분리 및 오디오 분할 CLI 도구 (Speaker Diarization & Audio Split CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "pyannote.audio>=3.1.1",
    "soundfile>=0.12.1",
    "numpy>=1.24.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
speaker-split = "speaker_split.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speaker_split*"]
